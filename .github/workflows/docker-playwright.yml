name: Docker Playwright

on:
  push:
    branches:
      - master
    paths:
      - "docker/Dockerfile.playwright"
      - ".github/workflows/docker-playwright.yml"
      - "uv.lock"
      - ".dockerignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract_version:
    name: Extract Playwright Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pw_version.outputs.version }}
      skip_build: ${{ steps.pw_version.outputs.skip_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract and Compare Playwright Version
        id: pw_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          function extract_from_uv_lock() {
            local lock_file="$1"
            awk '
              $0 == "name = \"playwright\"" { package = 1; next }
              package && /^version = "/ {
                value = $0
                sub(/^version = "/, "", value)
                sub(/"$/, "", value)
                print value
                exit
              }
            ' "${lock_file}"
          }

          VERSION=$(extract_from_uv_lock "uv.lock")

          if [ -z "${VERSION}" ]; then
            echo "Failed to extract playwright version"
            exit 1
          fi

          SKIP_BUILD=false

          if [ "${EVENT_NAME}" = "push" ] && \
            git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            RELEVANT_CHANGES=$(git diff --name-only \
              "${BEFORE_SHA}" "${CURRENT_SHA}" -- \
              uv.lock \
              docker/Dockerfile.playwright \
              .dockerignore \
              .github/workflows/docker-playwright.yml)

            if [ "${RELEVANT_CHANGES}" = "uv.lock" ]; then
              PREV_LOCK_FILE=$(mktemp)

              if git show "${BEFORE_SHA}:uv.lock" > "${PREV_LOCK_FILE}" 2>/dev/null; then
                PREV_VERSION=$(extract_from_uv_lock "${PREV_LOCK_FILE}")

                if [ -n "${PREV_VERSION}" ]; then
                  echo "Previous playwright version: ${PREV_VERSION}"
                  if [ "${PREV_VERSION}" = "${VERSION}" ]; then
                    SKIP_BUILD=true
                  fi
                else
                  echo "Previous playwright version not found in previous uv.lock."
                fi
              else
                echo "Unable to read previous uv.lock from ${BEFORE_SHA}; build will continue."
              fi
            fi
          elif [ "${EVENT_NAME}" = "push" ]; then
            echo "Previous commit unavailable; build will continue."
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "skip_build=${SKIP_BUILD}" >> "${GITHUB_OUTPUT}"
          echo "Playwright version: ${VERSION}"
          echo "Skip build: ${SKIP_BUILD}"

  docker:
    name: Docker Hub Release
    needs: [extract_version]
    if: needs.extract_version.outputs.skip_build != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Docker
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: wyf7685/bot7685
          tags: type=raw,value=playwright

      - name: Build and Publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile.playwright
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PLAYWRIGHT_VERSION=${{ needs.extract_version.outputs.version }}
            PLAYWRIGHT_BROWSER=firefox
          cache-from: type=gha
          cache-to: type=gha,mode=max
